<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mercado de pilotos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        table {
            border-collapse: collapse;
            margin-top: 20px;
            width: 100%;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        input,
        button {
            margin: 5px;
            padding: 8px;
        }

            button:disabled {
                cursor: not-allowed;
            }

        #subastaActual {
            font-weight: bold;
            font-size: 18px;
        }

        #managers {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 0;
            list-style: none;
        }

        .tarjeta-manager {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 16px;
            min-width: 230px;
        }

            .tarjeta-manager.mi-manager {
                border: 2px solid #2563eb;
                background-color: #eff6ff;
            }

            .tarjeta-manager h3 {
                margin-top: 0;
            }

            .tarjeta-manager ul {
                padding-left: 20px;
            }
    </style>
</head>

<body>
    <h1>Mercado de pilotos</h1>

    <button id="crearSala">
        Crear sala
    </button>

    <input id="codigo"
           placeholder="Código de sala">

    <input id="nombre"
           placeholder="Nombre del manager">

    <button id="entrar">
        Entrar en la sala
    </button>

    <p id="estado">
        Sin conectar
    </p>

    <p id="presupuesto">
        Presupuesto: -
    </p>

    <h2>Managers</h2>

    <ul id="managers"></ul>

    <h2>Mercado de pilotos</h2>

    <table>
        <thead>
            <tr>
                <th>Piloto</th>
                <th>Precio inicial</th>
                <th>Puja actual</th>
                <th>Estado</th>
                <th>Comprado por</th>
                <th>Tiempo</th>
                <th>Acción</th>
            </tr>
        </thead>

        <tbody id="pilotos"></tbody>
    </table>

    <h2>Subasta actual</h2>

    <p id="subastaActual">
        Sin subasta activa
    </p>

    <p id="liderSubasta">Sin pujas</p>

    <div id="pujasRapidas">
        <button type="button" data-extra="0" disabled>
            Puja mínima
        </button>

        <button type="button" data-extra="5" disabled>
            Mínima +5 M
        </button>

        <button type="button" data-extra="10" disabled>
            Mínima +10 M
        </button>
    </div>

    <input id="cantidad"
           type="number"
           min="1"
           placeholder="Cantidad en millones"
           disabled>

    <button id="pujar" disabled>
        Pujar
    </button>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>

    <script>
        let managerId = null;
        let nombreManager = "";
        let codigoSala = "";
        let conectado = false;

        let pilotos = [];
        let subastaActual = null;

        const estadosCompra = {
            0: "Disponible",
            1: "En subasta",
            2: "Comprado"
        };

        const connection =
            new signalR.HubConnectionBuilder()
                .withUrl("/salaHub")
                .build();

        function obtenerNombreEstado(estado) {
            if (typeof estado === "number") {
                return estadosCompra[estado];
            }

            return estado;
        }

        function actualizarSubastaActual() {
            const panel = document.getElementById("subastaActual");
            const lider = document.getElementById("liderSubasta");
            const inputCantidad = document.getElementById("cantidad");
            const botonPujar = document.getElementById("pujar");

            const botonesRapidos = document.querySelectorAll(
                "#pujasRapidas button"
            );

            const activa =
                subastaActual?.activa &&
                subastaActual?.pilotoActual;

            if (!activa) {
                panel.textContent = "Sin subasta activa";
                lider.textContent = "";
                lider.style.color = "";

                inputCantidad.disabled = true;
                inputCantidad.value = "";
                botonPujar.disabled = true;

                botonesRapidos.forEach(boton => {
                    boton.disabled = true;
                });

                return;
            }

            const pujaMinima = subastaActual.pujaActual === 0
                ? subastaActual.precioInicial
                : subastaActual.pujaActual + 1;

            const puedoParticipar =
                managerId !== null &&
                subastaActual.segundosRestantes > 0;

            panel.textContent =
                `Piloto: ${subastaActual.pilotoActual.nombre} | ` +
                `Puja actual: ${subastaActual.pujaActual} millones | ` +
                `Puja mínima: ${pujaMinima} millones | ` +
                `Tiempo: ${subastaActual.segundosRestantes} segundos`;

            inputCantidad.min = pujaMinima;
            inputCantidad.disabled = !puedoParticipar;
            botonPujar.disabled = !puedoParticipar;

            botonesRapidos.forEach(boton => {
                boton.disabled = !puedoParticipar;
            });

            if (!subastaActual.managerGanadorId) {
                lider.textContent = "Todavía no hay pujas.";
                lider.style.color = "";
            } else if (subastaActual.managerGanadorId === managerId) {
                lider.textContent = "Vas ganando la subasta.";
                lider.style.color = "#15803d";
            } else {
                lider.textContent =
                    `Va ganando: ${subastaActual.managerGanadorNombre}`;
                lider.style.color = "";
            }
        }

        function renderizarMercado() {
            const tabla =
                document.getElementById("pilotos");

            tabla.innerHTML = "";

            pilotos.forEach(piloto => {
                const estado =
                    obtenerNombreEstado(piloto.estadoCompra);

                const subastaDeEstePiloto =
                    subastaActual &&
                    subastaActual.activa &&
                    subastaActual.pilotoActual &&
                    subastaActual.pilotoActual.id === piloto.id;

                let accion = "-";

                if (estado === "Disponible" &&
                    !subastaActual?.activa) {
                    accion =
                        `<button data-piloto-id="${piloto.id}">
                                    Poner en subasta
                                 </button>`;
                }
                else if (subastaDeEstePiloto) {
                    accion = "Subasta activa";
                }
                else if (estado === "Comprado") {
                    accion = "Adjudicado";
                }

                const pujaActual =
                    piloto.pujaActual > 0
                        ? `${piloto.pujaActual} millones`
                        : "-";

                const tiempo =
                    subastaDeEstePiloto
                        ? `${subastaActual.segundosRestantes} segundos`
                        : "-";

                tabla.innerHTML += `
                            <tr>
                                <td>
                                    ${piloto.nombre}
                                </td>

                                <td>
                                    ${piloto.precioInicial} millones
                                </td>

                                <td>
                                    ${pujaActual}
                                </td>

                                <td>
                                    ${estado}
                                </td>

                                <td>
                                    ${piloto.compradoPor || "-"}
                                </td>

                                <td>
                                    ${tiempo}
                                </td>

                                <td>
                                    ${accion}
                                </td>
                            </tr>
                        `;
            });

            actualizarSubastaActual();
        }

        async function cargarMercado() {
            const respuesta = await fetch(
                `/api/Sala/${encodeURIComponent(codigoSala)}/pilotos`
            );

            if (!respuesta.ok) {
                document.getElementById("estado").textContent =
                    "No se pudo cargar el mercado.";

                return;
            }

            pilotos = await respuesta.json();

            renderizarMercado();
        }

        async function iniciarSubasta(pilotoId) {
            const respuesta = await fetch(
                `/api/Sala/${encodeURIComponent(codigoSala)}` +
                `/subasta/iniciar?pilotoId=${encodeURIComponent(pilotoId)}`,
                {
                    method: "POST"
                }
            );

            if (!respuesta.ok) {
                alert(await respuesta.text());
            }
        }
        let managersSala = [];

        function renderizarManagers() {
            const lista = document.getElementById("managers");
            lista.replaceChildren();

            managersSala.forEach(manager => {
                const esMiManager = manager.id === managerId;
                const pilotosComprados = manager.pilotos ?? [];

                const totalGastado = pilotosComprados.reduce(
                    (total, piloto) => total + piloto.pujaActual,
                    0
                );

                const tarjeta = document.createElement("li");
                tarjeta.className = "tarjeta-manager";

                if (esMiManager) {
                    tarjeta.classList.add("mi-manager");
                }

                const nombre = document.createElement("h3");
                nombre.textContent = esMiManager
                    ? `${manager.nombre} · Tú`
                    : manager.nombre;

                const presupuesto = document.createElement("p");
                presupuesto.textContent =
                    `Presupuesto restante: ${manager.presupuesto} millones`;

                const gasto = document.createElement("p");
                gasto.textContent =
                    `Total gastado: ${totalGastado} millones`;

                const tituloPilotos = document.createElement("strong");
                tituloPilotos.textContent =
                    `Pilotos adquiridos: ${pilotosComprados.length}`;

                tarjeta.append(
                    nombre,
                    presupuesto,
                    gasto,
                    tituloPilotos
                );

                if (pilotosComprados.length === 0) {
                    const mensaje = document.createElement("p");
                    mensaje.textContent = "Sin pilotos";
                    tarjeta.appendChild(mensaje);
                } else {
                    const listaPilotos = document.createElement("ul");

                    pilotosComprados.forEach(piloto => {
                        const elemento = document.createElement("li");
                        elemento.textContent =
                            `${piloto.nombre} — ${piloto.pujaActual} millones`;

                        listaPilotos.appendChild(elemento);
                    });

                    tarjeta.appendChild(listaPilotos);
                }

                lista.appendChild(tarjeta);

                if (esMiManager) {
                    document.getElementById("presupuesto").textContent =
                        `Presupuesto: ${manager.presupuesto} millones`;
                }
            });
        }

        connection.on("ManagersActualizados", managers => {
            managersSala = managers;
            renderizarManagers();
        });
        connection.on("MercadoActualizado", mercado => {
            pilotos = mercado;

            renderizarMercado();
        });

        connection.on("SubastaIniciada", subasta => {
            subastaActual = subasta;

            document.getElementById("estado").textContent =
                "Subasta iniciada.";

            renderizarMercado();
        });

        connection.on("PujaActualizada", subasta => {
            const ibaGanando =
                managerId !== null &&
                subastaActual?.managerGanadorId === managerId;

            subastaActual = subasta;

            const voyGanando =
                managerId !== null &&
                subasta.managerGanadorId === managerId;

            if (voyGanando) {
                document.getElementById("estado").textContent =
                    "Puja aceptada. Vas ganando la subasta.";
            } else if (ibaGanando) {
                document.getElementById("estado").textContent =
                    `${subasta.managerGanadorNombre} ha superado tu puja ` +
                    `con ${subasta.pujaActual} millones.`;
            }

            renderizarMercado();
        });

        connection.on("CronometroActualizado", segundos => {
            if (subastaActual) {
                subastaActual.segundosRestantes =
                    segundos;

                renderizarMercado();
            }
        });

        connection.on("SubastaSinPujas", () => {
            if (subastaActual) {
                subastaActual.activa = false;
            }

            document.getElementById("estado").textContent =
                "La subasta terminó sin pujas.";

            renderizarMercado();
        });

        connection.on("SubastaFinalizada", resultado => {
            if (subastaActual) {
                subastaActual.activa = false;
            }

            document.getElementById("estado").textContent =
                `${resultado.ganador} ha ganado la subasta de ` +
                `${resultado.piloto} por ${resultado.precio} millones.`;

            renderizarMercado();
        });

        document.getElementById("crearSala")
            .addEventListener("click", async () => {
                const respuesta = await fetch(
                    "/api/Sala/crear",
                    {
                        method: "POST"
                    }
                );

                const sala =
                    await respuesta.json();

                document.getElementById("codigo").value =
                    sala.codigo;

                document.getElementById("estado").textContent =
                    `Sala creada: ${sala.codigo}. ` +
                    "Introduce tu nombre y entra.";
            });

        document.getElementById("entrar")
            .addEventListener("click", async () => {
                codigoSala =
                    document.getElementById("codigo")
                        .value
                        .trim();

                nombreManager =
                    document.getElementById("nombre")
                        .value
                        .trim();

                if (!codigoSala || !nombreManager) {
                    alert(
                        "Introduce el código de sala y tu nombre."
                    );

                    return;
                }

                if (!conectado) {
                    await connection.start();

                    await connection.invoke(
                        "UnirseSala",
                        codigoSala
                    );

                    conectado = true;
                }

                const respuesta = await fetch(
                    `/api/Sala/${encodeURIComponent(codigoSala)}` +
                    `/entrar?nombre=${encodeURIComponent(nombreManager)}`,
                    {
                        method: "POST"
                    }
                );

                if (!respuesta.ok) {
                    document.getElementById("estado").textContent =
                        await respuesta.text();

                    return;
                }

                const manager =
                    await respuesta.json();

                managerId = manager.id;
                renderizarManagers();

                document.getElementById("presupuesto").textContent =
                    `Presupuesto: ${manager.presupuesto} millones`;

                document.getElementById("estado").textContent =
                    `${manager.nombre} conectado a la sala ` +
                    `${codigoSala}.`;

                document.getElementById("entrar").disabled =
                    true;

                await cargarMercado();
            });

        document.getElementById("pilotos")
            .addEventListener("click", async event => {
                const boton =
                    event.target.closest(
                        "[data-piloto-id]"
                    );

                if (!boton) {
                    return;
                }

                boton.disabled = true;

                await iniciarSubasta(
                    boton.dataset.pilotoId
                );
            });

        document.getElementById("pujar")
            .addEventListener("click", async () => {
                const cantidad =
                    Number(
                        document.getElementById("cantidad")
                            .value
                    );

                if (!Number.isInteger(cantidad) ||
                    cantidad <= 0) {
                    alert(
                        "Introduce una cantidad válida."
                    );

                    return;
                }

                const respuesta = await fetch(
                    `/api/Sala/${encodeURIComponent(codigoSala)}` +
                    `/subasta/pujar?managerId=${encodeURIComponent(managerId)}` +
                    `&cantidad=${encodeURIComponent(cantidad)}`,
                    {
                        method: "POST"
                    }
                );

                if (!respuesta.ok) {
                    alert(await respuesta.text());
                }
            });

        document.getElementById("pujasRapidas")
            .addEventListener("click", event => {
                const boton = event.target.closest("button[data-extra]");

                if (!boton ||
                    boton.disabled ||
                    !subastaActual?.activa ||
                    subastaActual.segundosRestantes <= 0) {
                    return;
                }

                const pujaMinima = subastaActual.pujaActual === 0
                    ? subastaActual.precioInicial
                    : subastaActual.pujaActual + 1;

                const extra = Number(boton.dataset.extra);
                const inputCantidad = document.getElementById("cantidad");

                inputCantidad.value = pujaMinima + extra;
                inputCantidad.focus();
            });
    </script>
</body>
</html>
